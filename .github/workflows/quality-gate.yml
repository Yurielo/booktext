name: BookText CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-gate:
    name: Quality Gate
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Install fixture export dependencies
        run: |
          python -m pip install reportlab Pillow
          brew install poppler pandoc
      - name: Full Python fixture suite with owned TMP
        env:
          BOOKTEXT_TEST_PYTHON: python
        run: ./scripts/test_suite.sh
      - name: Native protocol tests with disposable compiler scratch
        run: python tools/owned_workspace.py -- bash -c 'swift run --package-path BookTextApp --scratch-path "$TMPDIR/swift" BookTextProtocolTests'
